<div class="surface">
  <div class="surface-header">
    <div class="d-flex align-items-center justify-content-between">
      <div>
        <div class="h5 mb-0">{{ modo() === 'editar' ? 'Editar correo' : 'Agregar correo' }}</div>
        <div class="text-muted small">Relacionado a una persona (FK)</div>
      </div>
      <button type="button" class="btn btn-outline-light btn-sm" (click)="onCancelar()">Cerrar</button>
    </div>
  </div>

  <div class="surface-body">
    <form [formGroup]="form" class="row g-3" (ngSubmit)="onGuardar()">
      <div class="col-12">
        <label for="correo" class="form-label">Correo</label>
        <input id="correo" type="email" class="form-control" formControlName="correo" placeholder="correo@dominio.com" />
        @if (form.controls.correo.touched && form.controls.correo.invalid) {
          <div class="invalid-feedback d-block">Ingrese un correo válido.</div>
        }
      </div>

      <div class="col-12">
        <div class="form-check">
          <input id="esPrincipal" class="form-check-input" type="checkbox" formControlName="esPrincipal" />
          <label class="form-check-label" for="esPrincipal">Marcar como principal</label>
        </div>
      </div>

      <div class="col-12 d-flex justify-content-end gap-2 mt-2">
        <button type="button" class="btn btn-outline-light" (click)="onCancelar()">Cancelar</button>
        <button type="submit" class="btn btn-primary" [disabled]="cargando">
          {{ cargando ? 'Guardando...' : 'Guardar' }}
        </button>
      </div>
    </form>
  </div>
</div>
