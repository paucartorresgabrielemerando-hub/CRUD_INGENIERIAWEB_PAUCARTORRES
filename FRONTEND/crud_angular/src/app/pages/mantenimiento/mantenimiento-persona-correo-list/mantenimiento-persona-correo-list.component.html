<div class="surface">
  <div class="surface-header">
    <div class="d-flex flex-wrap align-items-center justify-content-between gap-2">
      <div>
        <div class="h5 mb-0">Correos</div>
        <div class="text-muted small">CRUD de correos dependientes de Persona</div>
      </div>

      <div class="d-flex align-items-center gap-2">
        <select class="form-select form-select-sm" (change)="onPersonaChange(($any($event.target)).value)">
          <option value="">Seleccione Persona</option>
          @for (p of personas(); track p.id) {
            <option [value]="p.id" [selected]="p.id === selectedPersonaId()">
              #{{ p.id }} - {{ p.nombres }} {{ p.apellidoPaterno }}
            </option>
          }
        </select>
        <button type="button" class="btn btn-primary btn-sm" (click)="abrirAgregar()" [disabled]="!selectedPersonaId()">
          Agregar
        </button>
      </div>
    </div>
  </div>

  <div class="surface-body">
    <div class="table-responsive">
      <table class="table table-bordered table-striped align-middle">
        <thead>
          <tr>
            <th style="width: 80px">ID</th>
            <th>Correo</th>
            <th style="width: 160px">Principal</th>
            <th style="width: 220px">Acciones</th>
          </tr>
        </thead>
        <tbody>
          @for (c of correos(); track c.id) {
            <tr>
              <td>{{ c.id }}</td>
              <td>{{ c.correo }}</td>
              <td>
                <span class="badge" [class.bg-success]="c.esPrincipal" [class.bg-secondary]="!c.esPrincipal">
                  {{ c.esPrincipal ? 'Sí' : 'No' }}
                </span>
              </td>
              <td>
                <button type="button" class="btn btn-sm btn-warning me-2" (click)="abrirEditar(c)">Editar</button>
                <button type="button" class="btn btn-sm btn-danger" (click)="eliminar(c)">Eliminar</button>
              </td>
            </tr>
          } @empty {
            <tr>
              <td colspan="4" class="text-center text-muted">Seleccione una persona para ver correos.</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>

  @if (mostrarModal) {
    <div class="modal-backdrop-custom" (click)="cerrarModal()"></div>
    <div class="modal-custom" role="dialog" aria-modal="true">
      <app-mantenimiento-persona-correo-editar
        [item]="itemSeleccionado"
        [personaId]="selectedPersonaId()"
        [modo]="modoEdicion"
        (cancelado)="cerrarModal()"
        (guardado)="onGuardado()"
      />
    </div>
  }
</div>
